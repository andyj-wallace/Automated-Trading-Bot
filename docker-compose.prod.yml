name: trading-bot

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.50
    restart: always
    environment:
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: paper
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: America/New_York
      TZ: America/New_York
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD}
    ports: ["127.0.0.1:5900:5900"]
    networks: [internal]
    logging: *default-logging

  db:
    image: timescale/timescaledb:2.26.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trading_bot
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    logging: *default-logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      BROKER: ibkr
      IBKR_HOST: ib-gateway
      IBKR_PORT: "4004"
      IBKR_TRADING_MODE: paper
      DATABASE_URL: postgresql+asyncpg://trading:${POSTGRES_PASSWORD}@db:5432/trading_bot
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
      CORS_ORIGINS: "[]"
    volumes: [app_logs:/app/logs]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      ib-gateway: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [internal]
    logging: *default-logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro"]
    depends_on: [backend]
    networks: [internal]
    logging: *default-logging

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  app_logs:
